---
- name: Verificar se os containers esperados estao em execucao
  ansible.builtin.command: "docker inspect -f {{ '{{' }}.State.Running{{ '}}' }} {{ item }}"
  register: container_running
  changed_when: false
  loop:
    - pm04-api
    - pm04-nginx
    - pm04-caddy
  failed_when: container_running.stdout != "true"

- name: Verificar /todos direto no container do Nginx (sem depender do Caddy/TLS)
  ansible.builtin.command: docker exec pm04-nginx wget -q -O - http://127.0.0.1/todos
  register: nginx_health
  changed_when: false
  retries: 10
  delay: 5
  until: nginx_health.rc == 0

- name: Verificar HTTPS publico via Caddy (emissao do certificado Let's Encrypt pode levar um tempo)
  ansible.builtin.uri:
    url: "https://{{ app_domain }}/todos"
    status_code: [200]
    validate_certs: true
  register: https_health
  retries: 20
  delay: 15
  until: https_health.status == 200
  when: wait_for_https | default(true) | bool

- name: Resumo do healthcheck (visivel no job summary)
  ansible.builtin.debug:
    msg: >-
      OK: containers pm04-api/pm04-nginx/pm04-caddy em execucao,
      /todos respondendo via Nginx local{{ ' e via HTTPS publico (' + app_domain + ')' if (wait_for_https | default(true) | bool) else '' }}.
