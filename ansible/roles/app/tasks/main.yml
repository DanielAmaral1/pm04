---
# O GITHUB_TOKEN usado aqui e efemero (valido so durante o job que o gerou),
# entao o login precisa ser refeito em toda execucao - pular quando "ja
# logado" deixaria uma credencial expirada no config.json e o pull falharia
# com "denied". community.docker.docker_login tambem sempre reporta
# changed=true ao autenticar (nao verifica se a credencial atual ja e
# valida); como renovar esse token efemero e esperado em toda execucao e
# nao e uma mudanca real de configuracao, o changed_when fica fixo em false
# para nao contaminar a idempotencia do Ansible (changed=0 no cenario 3).
- name: Login no GHCR (necessario pois os pacotes sao privados; a VM so faz pull)
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ ghcr_actor }}"
    password: "{{ ghcr_token }}"
  changed_when: false
  no_log: true

- name: Criar diretorio do stack da aplicacao
  ansible.builtin.file:
    path: /opt/pm04/app
    state: directory
    mode: "0750"

- name: Gerar Caddyfile (dominio sslip.io, HTTPS automatico)
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /opt/pm04/app/Caddyfile
    mode: "0640"

- name: Gerar docker-compose.yml da aplicacao (api + nginx + caddy)
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/pm04/app/docker-compose.yml
    mode: "0640"
  no_log: true

- name: Subir/atualizar o stack da aplicacao (idempotente)
  community.docker.docker_compose_v2:
    project_src: /opt/pm04/app
    state: present
    pull: always
  register: app_compose_result
