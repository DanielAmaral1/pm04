---
# community.docker.docker_login sempre reporta changed=true quando autentica
# (nao verifica se a credencial atual ja e valida). Para nao quebrar a
# idempotencia do Ansible (changed=0 na reexecucao), so logamos se o
# config.json do Docker ainda nao tiver uma entrada para o ghcr.io.
- name: Verificar se ja existe login no GHCR
  ansible.builtin.command: grep -q ghcr.io /root/.docker/config.json
  register: ghcr_login_check
  failed_when: false
  changed_when: false

- name: Login no GHCR (necessario pois os pacotes sao privados; a VM so faz pull)
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ ghcr_actor }}"
    password: "{{ ghcr_token }}"
  when: ghcr_login_check.rc != 0
  no_log: true

- name: Criar diretorio do stack da aplicacao
  ansible.builtin.file:
    path: /opt/pm04/app
    state: directory
    mode: "0750"

- name: Gerar Caddyfile (dominio sslip.io, HTTPS automatico)
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /opt/pm04/app/Caddyfile
    mode: "0640"

- name: Gerar docker-compose.yml da aplicacao (api + nginx + caddy)
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/pm04/app/docker-compose.yml
    mode: "0640"
  no_log: true

- name: Subir/atualizar o stack da aplicacao (idempotente)
  community.docker.docker_compose_v2:
    project_src: /opt/pm04/app
    state: present
    pull: always
  register: app_compose_result
